<header class="h-14 bg-white border-b border-gray-200 flex items-center justify-between px-6">
  <div></div>
  <div class="flex items-center">
    <div class="w-9 h-9 rounded-full bg-blue-100 text-blue-600 font-bold flex items-center justify-center text-sm shrink-0">
      {{ initials() }}
    </div>
    <div class="relative">
      <button
        type="button"
        (click)="toggleMenu()"
        class="flex items-center gap-2 rounded-md hover:bg-gray-100 px-2 py-1"
      >
        <div class="flex flex-col leading-tight text-left">
          <span class="text-sm font-medium text-gray-800">
            {{ displayName() }}
          </span>
          @if (roleName()) {
            <span class="text-sm font-medium uppercase">
              {{ roleName() }}
            </span>
          }
        </div>
        <svg
          class="w-4 h-4 self-start mt-1 transition-transform"
          [class.rotate-180]="menuOpen()"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
        <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 9l-7 7-7-7"
        />
        </svg>
      </button>
      @if (menuOpen()) {
        <div class="absolute left-0 top-full mt-2 w-full rounded-lg border border-gray-200 bg-white shadow-lg z-50">
          <button
            type="button"
            (click)="goToProfile()"
            class="block w-full px-4 py-2 text-left text-sm hover:bg-gray-100"
          >
            {{ 'HEADER.PROFILE' | translate }}
          </button>
          <button
            type="button"
            (click)="onLogout()"
            class="block w-full px-4 py-2 text-left text-sm text-red-600 hover:bg-red-50"
          >
            {{ 'HEADER.LOGOUT' | translate }}
          </button>
        </div>
      }
    </div>
  </div>
</header>
